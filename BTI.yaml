# Python 3.12 environment for PyBTI's current numerical and plotting workflows.
# Create: conda env create --file BTI.yaml
# Activate: conda activate BTI
# Another environment name: conda env create --file BTI.yaml --name BTI-test
# Pin direct scientific dependencies to isolate the Python upgrade.
# Platform-specific builds and transitive dependencies are solved by Conda.
name: BTI
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=1.26.4
  - scipy=1.14.1
  - matplotlib=3.10.9
  - pytest=9.0.3
  - jupyterlab>=4,<5
  - ipykernel>=6,<8
  - nbclient>=0.10,<1
  - pip
  - pip:
      # DRAM implementation used by the SITE_MCMC.m translation.
      - pymcmcstat==1.9.1
